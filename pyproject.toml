[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sapi-probanap"
version = "0.1.0"
description = "AI agent for processing meeting transcripts and extracting scored news pieces"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sapi_probanap"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
